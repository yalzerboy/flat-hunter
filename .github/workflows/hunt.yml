name: Flat hunt

# The repo is public, so nothing personal touches it in the clear:
# config.py comes from the CONFIG_PY secret, state is committed encrypted,
# and the run's output goes to an encrypted artifact (read it with ./logs.sh).

on:
  schedule:
    # Only restarts a broken chain; the checks themselves are timed by keeper.sh.
    # GitHub's schedule is best-effort (it skipped nine hours on 21 Oct), so it
    # can't be the clock. A run that finds the chain alive exits in seconds.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "One-off run with these args, e.g. --backfill 3 or --digest-now (empty = start the loop)"
        required: false
        default: ""
      chain:
        description: "Set by keeper.sh when it starts its successor"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  # A scheduled run only goes ahead when no loop is running or waiting.
  guard:
    if: github.repository == 'yalzerboy/flat-hunter'   # forks don't run it
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            others=$(gh api "repos/${{ github.repository }}/actions/workflows/hunt.yml/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})
                     | select(.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending")] | length')
            [ "$others" -gt 0 ] && go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "go=$go"

  hunt:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub's limit is 360; keeper.sh hands over before this
    concurrency:
      group: flat-hunt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # not the commit this run was queued at: the state must be the latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Unpack config and state
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          printf '%s' "$CONFIG_PY" | base64 -d > config.py
          if [ -f state/state.json.enc ]; then
            ./crypt.sh dec state/state.json.enc state/state.json
            sha256sum state/state.json > "$RUNNER_TEMP/state.sha"
          fi

      - name: Hunt
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          ARGS: ${{ github.event.inputs.args }}
        # Output stays out of the public log.
        run: |
          git config user.name "flat-hunter"
          git config user.email "flat-hunter@users.noreply.github.com"
          if [ -z "$ARGS" ]; then exec ./keeper.sh; fi
          set +e
          python hunter.py $ARGS > run.log 2>&1
          rc=$?
          echo "hunter.py exited $rc ($(wc -l < run.log) log lines; ./logs.sh to read)"
          exit $rc

      - name: Encrypt log
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: if [ -f run.log ]; then ./crypt.sh enc run.log run.log.enc; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-log
          path: run.log.enc
          retention-days: 14
          if-no-files-found: ignore

      - name: Save state
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: ./keeper.sh --save-only
