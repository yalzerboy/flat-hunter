name: Flat hunt

# The repo is public, so nothing personal touches it in the clear:
# config.py comes from the CONFIG_PY secret, state is committed encrypted,
# and the run's output goes to an encrypted artifact (read it with ./logs.sh).

on:
  schedule:
    # Every 30 min, roughly 06:00-23:30 London (cron is UTC; GitHub may run a few minutes late).
    - cron: "0,30 5-22 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra args, e.g. --backfill 3 or --digest-now"
        required: false
        default: ""

concurrency:
  group: flat-hunt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hunt:
    if: github.repository == 'yalzerboy/flat-hunter'   # forks don't run it
    runs-on: ubuntu-latest
    timeout-minutes: 240   # normal runs take 1-3 min; backfills can take a couple of hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Unpack config and state
        env:
          CONFIG_PY: ${{ secrets.CONFIG_PY }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          printf '%s' "$CONFIG_PY" | base64 -d > config.py
          if [ -f state/state.json.enc ]; then
            ./crypt.sh dec state/state.json.enc state/state.json
            sha256sum state/state.json > "$RUNNER_TEMP/state.sha"
          fi

      - name: Hunt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          ARGS: ${{ github.event.inputs.args }}
        # Output stays out of the public log.
        run: |
          set +e
          python hunter.py $ARGS > run.log 2>&1
          rc=$?
          echo "hunter.py exited $rc ($(wc -l < run.log) log lines; ./logs.sh to read)"
          exit $rc

      - name: Encrypt log
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: if [ -f run.log ]; then ./crypt.sh enc run.log run.log.enc; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-log
          path: run.log.enc
          retention-days: 14
          if-no-files-found: ignore

      - name: Save state
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          [ -f state/state.json ] || exit 0
          # Encryption is salted, so only re-encrypt when the state really changed.
          if [ -f "$RUNNER_TEMP/state.sha" ] && sha256sum -c --quiet "$RUNNER_TEMP/state.sha" 2>/dev/null; then exit 0; fi
          ./crypt.sh enc state/state.json state/state.json.enc
          git config user.name "flat-hunter"
          git config user.email "flat-hunter@users.noreply.github.com"
          git add state/state.json.enc
          git diff --cached --quiet || git commit -q -m "state $(date -u +%FT%TZ)"
          git pull -q --rebase && git push -q
